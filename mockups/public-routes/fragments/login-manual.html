<section class="screen screen--form" aria-labelledby="manual-title">
    <header class="screen__head">
        <p class="eyebrow">
            <span class="eyebrow__icon"><i data-lucide="key-round" aria-hidden="true"></i></span>
            Step 01 / Account
        </p>
        <h1 id="manual-title">Sign in</h1>
        <p class="lede">Use your Jellyfin account. Your session stays on this device until you sign out.</p>
    </header>

    <form class="form" data-mock>
        <div class="field">
            <label for="username">Username</label>
            <input class="input" id="username" name="username" type="text" value="Maya" autocomplete="username" autocapitalize="off" spellcheck="false">
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input class="input" id="password" name="password" type="password" value="jellyfin" autocomplete="current-password">
        </div>

        <label class="check">
            <input type="checkbox" checked>
            <span>Remember me on this device</span>
        </label>

        <div class="form__actions">
            <button class="btn btn--primary btn--block" type="submit">
                <i data-lucide="log-in" aria-hidden="true"></i>
                Sign in
            </button>
            <a class="btn btn--ghost btn--block" href="/login" hx-get="/login" hx-target="#screen" hx-swap="innerHTML" hx-push-url="true">
                <i data-lucide="arrow-left" aria-hidden="true"></i>
                Back to profiles
            </a>
        </div>

        <p class="form__foot">
            Prefer your phone? <a href="/quickconnect" hx-get="/quickconnect" hx-target="#screen" hx-swap="innerHTML" hx-push-url="true">Use Quick Connect</a>
        </p>
    </form>

    <div class="hint-card">
        <i data-lucide="info" aria-hidden="true"></i>
        <p>Signing in with a password requires a secure connection. Server administrators can enforce HTTPS.</p>
    </div>
</section>
